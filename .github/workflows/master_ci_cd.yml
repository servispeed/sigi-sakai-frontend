name: master_ci_cd

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ==========================================
  # FASE 1: CONSTRUCCIÓN EN LA NUBE (ubuntu-latest)
  # ==========================================
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linting
        run: npm run lint

      - name: Construir aplicación React/Next.js
        run: npm run build

      - name: Instalar Wine (Requerido para compilar a Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32

      - name: Empaquetar con Electron Builder
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx electron-builder --config electron-builder.config.cjs --win --publish never
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}

      # Sube los ejecutables generados para pasarlos a la Fase 2
      - name: Subir artefactos de actualización
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: electron-updates
          path: dist/
          retention-days: 1 # Solo lo necesitamos para el despliegue

  # ==========================================
  # FASE 2: DESPLIEGUE EN SERVIDOR IONOS (self-hosted)
  # ==========================================
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-package
    runs-on: self-hosted
    
    steps:
      - name: Crear directorio de actualizaciones si no existe
        run: mkdir -p /home/github-runner/sigi-updates-prod/

      - name: Descargar artefactos al servidor
        uses: actions/download-artifact@v4
        with:
          name: electron-updates
          path: /home/github-runner/sigi-updates-prod/

      - name: Ajustar permisos del directorio
        run: |
          chown -R github-runner:github-runner /home/github-runner/sigi-updates-prod/
          chmod -R 755 /home/github-runner/sigi-updates-prod/