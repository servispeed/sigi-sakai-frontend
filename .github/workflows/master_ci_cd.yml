name: master_ci_cd

# Triggers
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Jobs
jobs:
  build-and-test:
    # Usamos tu Self-Hosted Runner local en IONOS
    runs-on: self-hosted

    steps:
      # 1. Obtener el código
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Ejecutar pruebas de Linting
      - name: Run Lint
        run: npm run lint

      # 5. Construir la aplicación (React / Next.js)
      - name: Build React/Next.js App
        run: npm run build

      # 6. Empaquetar la aplicación de Electron con electron-builder
      - name: Build Electron App
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx electron-builder --win --publish never
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}

      # 7. Copiar las actualizaciones al directorio local del servidor IONOS
      - name: Copy updates to Server Directory
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p /home/github-runner/sigi-updates-prod
          cp -rf dist/* /home/github-runner/sigi-updates-prod/
          chmod -R 755 /home/github-runner/sigi-updates-prod/